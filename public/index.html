<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>三国杀 1v1</title>
<style>
  :root { --red:#c0392b; --black:#2c3e50; --bg:#1a1a1a; --panel:#262626; --gold:#d4af37; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: #ddd; font-family: "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid #444; }
  header h1 { font-size: 18px; color: var(--gold); }
  header .phase { color: #aaa; font-size: 13px; }
  button { background: #3a5a3a; color: #fff; border: 1px solid #5a7a5a; border-radius: 4px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button:hover { background: #4a6a4a; }
  button:disabled { opacity: .4; cursor: default; }
  button.danger { background: #6a2a2a; border-color: #8a4a4a; }
  main { flex: 1; display: flex; flex-direction: column; padding: 8px 16px; gap: 8px; overflow: hidden; }
  .playerbar { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid #3a3a3a; border-radius: 8px; padding: 8px 12px; min-height: 86px; }
  .playerbar.active { border-color: var(--gold); box-shadow: 0 0 8px rgba(212,175,55,.35); }
  .avatar { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; border: 2px solid #555; }
  .pinfo { display: flex; flex-direction: column; gap: 2px; min-width: 130px; }
  .pname { font-size: 16px; font-weight: bold; color: #fff; }
  .pskills { font-size: 11px; color: #9ab; max-width: 420px; }
  .hp { letter-spacing: 2px; font-size: 15px; }
  .hp .on { color: #e74c3c; } .hp .off { color: #444; }
  .zones { font-size: 11px; color: #89a; line-height: 1.5; }
  .zone-chip { background: #333; border-radius: 3px; padding: 1px 5px; margin-right: 4px; display: inline-block; }
  .zone-chip .zl { color: #9ab; margin-right: 3px; font-style: normal; font-size: 10px; }
  .zone-chip.eq-sel { cursor: pointer; border: 1px solid var(--gold); }
  .zone-chip.eq-selected { background: var(--gold); color: #222; }
  .hand { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0; min-height: 128px; align-items: center; }
  .card { width: 86px; height: 120px; border-radius: 6px; background: #f5f0e0; color: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #999; position: relative; cursor: default; overflow: hidden; }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  .card .fallback { text-align: center; padding: 4px; font-size: 15px; font-weight: bold; }
  .card .fallback .suit { font-size: 14px; }
  .card .corner { position: absolute; top: 0; left: 0; right: 0; padding: 1px 0; font-size: 13px; font-weight: bold; text-align: center; background: rgba(255,255,255,.85); }
  .card .corner.cr { color: #c0392b; } .card .corner.cb { color: #222; }
  .card.back { background: repeating-linear-gradient(45deg, #3a5580 0 9px, #2e4468 9px 18px); border-color: #24344f; }
  .hlabel { font-size: 11px; color: #789; align-self: center; margin-right: 4px; }
  .card.selectable { cursor: pointer; border-color: var(--gold); }
  .card.selected { outline: 3px solid var(--gold); }
  .card.dimmed { opacity: .35; filter: grayscale(.7); }
  .card.newdraw { border-color: #ffd700; box-shadow: 0 0 10px 2px rgba(255,215,0,.7); animation: newdraw-pulse 1s ease-in-out 3; }
  @keyframes newdraw-pulse { 50% { box-shadow: 0 0 20px 6px rgba(255,215,0,.95); } }
  #playconfirm button.confirm { background: #7a5a1a; border-color: var(--gold); }
  button.danger2 { background: #5a3a3a; border-color: #8a5a5a; }
  .card .tagnote { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.55); color: #ffd; font-size: 9px; text-align: center; }
  .mid { flex: 1; display: flex; gap: 12px; overflow: hidden; }
  .logbox { flex: 1; background: #151515; border: 1px solid #333; border-radius: 6px; padding: 6px 10px; overflow-y: auto; font-size: 12px; line-height: 1.7; }
  .logbox .sys { color: #7ab; } .logbox .hit { color: #e8a; }
  .pilebox { width: 320px; background: #151515; border: 1px solid #333; border-radius: 6px; padding: 6px 10px; font-size: 12px; }
  .pilebox .pilecards { color: #ab8; }
  #promptbar { background: var(--panel); border: 1px solid var(--gold); border-radius: 8px; padding: 8px 12px; min-height: 48px; }
  #promptbar .q { color: var(--gold); font-size: 14px; margin-bottom: 6px; }
  #promptbar .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  #promptbar .waiting { color: #888; font-size: 13px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 10; }
  .overlay h2 { font-size: 28px; color: var(--gold); }
  .overlay button { font-size: 16px; padding: 10px 24px; }
  .hidden { display: none !important; }
  .spin { color: var(--gold); }
  .roletag { font-size: 10px; border-radius: 3px; padding: 1px 6px; color: #fff; font-weight: normal; }
  .roletag.zhu { background: #a03030; }
  .roletag.nong { background: #3a7a3a; }
  /* 开局选将：头像+信息选项卡（大字号大图，方便观看） */
  .xjrow { display: flex; gap: 14px; flex-wrap: wrap; }
  .xjcard { display: flex; gap: 12px; background: #1e2a1e; border: 2px solid #4a6a4a; border-radius: 10px; padding: 12px; cursor: pointer; width: 430px; transition: border-color .15s, box-shadow .15s; }
  .xjcard:hover { border-color: var(--gold); box-shadow: 0 0 12px rgba(212,175,55,.45); }
  .xjavatar { width: 160px; height: 160px; border-radius: 8px; object-fit: cover; border: 1px solid #555; flex: none; align-self: flex-start; background: #111; }
  .xjinfo { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .xjname { font-size: 20px; font-weight: bold; color: #fff; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .xjtag { font-size: 13px; font-weight: normal; background: #333; border-radius: 3px; padding: 2px 7px; color: #bcd; }
  .xjhp { font-size: 15px; color: #e74c3c; margin-left: auto; font-weight: normal; letter-spacing: 1px; }
  .xjskills { font-size: 13px; color: #abc; line-height: 1.7; max-height: 250px; overflow-y: auto; }
  .xjskills b { color: var(--gold); }
</style>
</head>
<body>
<header>
  <h1>三国杀 · 人机对战</h1>
  <button id="btnStart">1v1对局</button>
  <button id="btnStartDD">斗地主（1v2）</button>
  <button id="btnSave" disabled title="保存当前对局进度，之后可继续">存档退出</button>
  <span class="phase" id="phaseInfo">未开始</span>
  <span class="phase hidden" id="envBadge" style="background:#6a4a1a;border-color:#8a6a3a">测试环境</span>
  <span class="phase" id="modelInfo"></span>
  <label style="font-size:13px;color:#abc;cursor:pointer"><input type="checkbox" id="dbg"> 调试：显示AI手牌</label>
  <span class="spin hidden" id="aiThinking">AI思考中…</span>
</header>
<main>
  <div class="playerbar" id="bar1"></div>
  <div class="hand" id="hand1" style="min-height:0"></div>
  <div id="oppzone" style="display:flex;flex-direction:column;gap:6px;"></div>
  <div class="mid">
    <div class="logbox" id="log"></div>
    <div class="pilebox">
      <div>回合：<span id="turnInfo">-</span></div>
      <div style="margin:6px 0">牌堆余 <b id="drawN">-</b> ｜ 弃牌堆 <b id="discN">-</b>张</div>
      <div>弃牌堆（最近8张）：<div class="pilecards" id="discPile"></div></div>
    </div>
  </div>
  <div id="promptbar"><div class="waiting">等待对局开始…</div></div>
  <div class="playerbar" id="bar0"></div>
  <div class="hand" id="hand0"></div>
</main>
<div class="overlay hidden" id="overOverlay">
  <h2 id="overText"></h2>
  <button onclick="document.getElementById('overOverlay').classList.add('hidden')">关闭</button>
</div>
<div class="overlay hidden" id="resumeOverlay">
  <h2>发现未完成的对局</h2>
  <div id="saveList" style="display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;"></div>
  <button onclick="document.getElementById('resumeOverlay').classList.add('hidden')">关闭</button>
</div>
<script>
const $ = id => document.getElementById(id);
let state = null;
let curAsk = null;
let guanxingTop = [];  // 观星：牌堆顶的牌id，数组顺序即最终叠放顺序（左侧最先被摸到）
let guanxingBottom = []; // 观星：牌堆底的牌id，数组顺序即最终叠放顺序（左侧更靠近牌堆中段）
let selected = new Set();

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function suitColor(s){return (s==='♥'||s==='♦')?'#c0392b':'#222';}
function avatarUrl(name){return '/素材/武将/'+encodeURIComponent(name)+'-头像.png';}

function renderHand1() {
  const box = $('hand1');
  if (!state || !state.players[1]) { box.innerHTML = ''; return; }
  const n = state.players[1].handCount || 0;
  if ($('dbg').checked && state.aiHand && state.aiHand.length) {
    box.innerHTML = '<div class="hlabel">AI手牌（调试）:</div>' + state.aiHand.map(c => cardHtml(c, false, false)).join('');
  } else {
    box.innerHTML = '<div class="hlabel">AI手牌:</div>' + Array.from({ length: n }, () => '<div class="card back"></div>').join('');
  }
}
function render() {
  if (!state) return;
  $('phaseInfo').textContent = state.over ? '对局结束' : `第${state.turnNo}回合 · ${state.phase||''}阶段`;
  $('turnInfo').textContent = `第${state.turnNo}回合（${state.players[state.turnPlayer??0]?.general||''} 行动）`;
  $('drawN').textContent = state.drawPileCount;
  $('discN').textContent = state.discardTotal;
  $('discPile').textContent = state.discardPile.map(c=>c.name+c.suit+c.rank).join('、') || '空';
  renderPlayer(1, state.players[1], state.turnPlayer===1);
  renderOpp2();
  renderPlayer(0, state.players[0], state.turnPlayer===0);
  renderHand();
  renderHand1();
}
// 第三名玩家（斗地主）：动态生成 bar2/hand2
function renderOpp2() {
  const zone = $('oppzone');
  if (!zone) return;
  if (!state || !state.players[2]) { zone.innerHTML = ''; return; }
  if (!document.getElementById('bar2')) {
    zone.innerHTML = '<div class="playerbar" id="bar2" style="min-height:70px"></div><div class="hand" id="hand2" style="min-height:0"></div>';
  }
  renderPlayer(2, state.players[2], state.turnPlayer===2);
  const box = $('hand2');
  const n = state.players[2].handCount || 0;
  if ($('dbg').checked && state.aiHand2 && state.aiHand2.length) {
    box.innerHTML = '<div class="hlabel">AI手牌（调试）:</div>' + state.aiHand2.map(c => cardHtml(c, false, false)).join('');
  } else {
    box.innerHTML = '<div class="hlabel">AI手牌:</div>' + Array.from({ length: n }, () => '<div class="card back"></div>').join('');
  }
}
function renderPlayer(idx, p, active) {
  const bar = $('bar'+idx);
  bar.classList.toggle('active', active);
  const hp = Array.from({length:p.maxHp},(_,i)=>`<span class="${i<p.hp?'on':'off'}">●</span>`).join('');
  const who = idx===0 ? '（你）' : '（AI）';
  // 贯石斧弃牌 or 制衡：自己的装备区芯片可点选（弃置装备区的牌）
  const zhihengSel = idx===0 && curAsk && (curAsk.options||[]).some(o=>o.kind==='skill_zhiheng');
  const axeSel = idx===0 && ((curAsk && curAsk.decisionType==='discard' && (curAsk.options||[]).some(o=>o.area==='any')) || zhihengSel);
  const eq = p.equips;
  const EQ_LABELS = { weapon:'武器', armor:'防具', horsePlus:'+1马', horseMinus:'-1马' };
  const eqStr = ['weapon','armor','horsePlus','horseMinus'].map(k=>{
    const c = eq[k]; if (!c) return '';
    const label = `<span class="zl">${EQ_LABELS[k]}</span>`;
    if (axeSel) {
      const sel = selected.has(c.id);
      return `<span class="zone-chip eq-sel ${sel?'eq-selected':''}" data-cid="${c.id}">${label}${c.name}${c.suit}${c.rank}</span>`;
    }
    return `<span class="zone-chip">${label}${c.name}${c.suit}${c.rank}</span>`;
  }).join('');
  const judge = p.judge.map(c=>`<span class="zone-chip" style="color:#e8a">${c.name}${c.suit}${c.rank}</span>`).join('');
  const skillStr = p.skills.map(s=>`【${s.name}】${s.text}`).join('　');
  const roleTag = p.role ? `<span class="roletag ${p.role==='地主'?'zhu':'nong'}">${p.role}</span>` : '';
  const deadTag = p.dead ? '<span style="font-size:11px;color:#777">（阵亡）</span>' : '';
  bar.innerHTML = `
    <img class="avatar" src="${avatarUrl(p.general)}" alt="" ${p.dead?'style="filter:grayscale(1);opacity:.5"':''}>
    <div class="pinfo">
      <div class="pname">${esc(p.general)}${roleTag}${who}${deadTag} <span style="font-size:11px;color:#889">${p.kingdom}</span></div>
      <div class="hp">${hp} <span style="font-size:11px;color:#99a">(${p.hp}/${p.maxHp})</span></div>
      <div class="pskills">${esc(skillStr)}</div>
    </div>
    <div class="zones">手牌 ${p.handCount}张<br>${eqStr||'<span style="color:#555">无装备</span>'}${judge?`<br>${judge}`:''}</div>`;
  if (axeSel) {
    bar.querySelectorAll('.eq-sel').forEach(el => {
      el.onclick = () => {
        const id = +el.dataset.cid;
        if (selected.has(id)) selected.delete(id); else selected.add(id);
        el.classList.toggle('eq-selected');
        renderPromptMulti();
        renderPlayConfirm(); // 制衡按钮的计数随装备选择刷新
      };
    });
  }
}
function cardHtml(c, selectable, selectedId, isNew, dim) {
  const red = suitColor(c.suit)==='#c0392b';
  const inner = c.image
    ? `<img src="/${c.image}" onerror="this.outerHTML='<div class=\\'fallback\\'>${c.name}<br><span class=\\'suit\\' style=\\'color:${red?"#c0392b":"#222"}\\'>${c.suit}${c.rank}</span></div>'"><div class="corner ${red?'cr':'cb'}">${c.suit}${c.rank}</div>`
    : `<div class="fallback">${c.name}<br><span class="suit" style="color:${red?'#c0392b':'#222'}">${c.suit}${c.rank}</span></div>`;
  const eqTag = c.equip === '坐骑+1' ? '+1马' : c.equip === '坐骑-1' ? '-1马' : c.equip;
  const note = ((c.subtype && c.subtype!=='普通杀') || eqTag)
    ? `<div class="tagnote">${[c.subtype && c.subtype!=='普通杀' ? c.subtype : null, eqTag].filter(Boolean).join('·')}</div>` : '';
  return `<div class="card ${selectable?'selectable':''} ${selectedId?'selected':''} ${isNew?'newdraw':''} ${dim?'dimmed':''}" data-id="${c.id}">${inner}${note}</div>`;
}
let prevHandIds = null; // 上一state的手牌id集合：识别新摸的牌做高亮
function isPlayAsk() { return curAsk && curAsk.decisionType==='play' && !curAsk.skill; }
function isRespondAsk() { return curAsk && (curAsk.decisionType==='respond_sha' || curAsk.decisionType==='respond_nanman'); }
function playMovesFor(ids) {
  const opts = (curAsk && curAsk.options) || [];
  if (ids.length === 1) return opts.filter(m => (m.kind === 'play' || m.kind === 'respond') && m.cardId === ids[0]);
  if (ids.length === 2) {
    // 丈八蛇矛：引擎下发的sha_combo带合法池（cardIds），所选两手牌必须都在池内
    const combo = opts.find(m => m.kind === 'sha_combo');
    if (!combo || !combo.cardIds) return [];
    const ok = ids[0] !== ids[1] && ids.every(id => combo.cardIds.includes(id));
    return ok ? [{ ...combo, cardIds: [...ids] }] : [];
  }
  return [];
}
function renderHand() {
  const hand = state.ownHand || [];
  const fresh = prevHandIds ? hand.filter(c => !prevHandIds.has(c.id)).map(c => c.id) : [];
  prevHandIds = new Set(hand.map(c => c.id));
  const isMulti = curAsk && (curAsk.decisionType==='discard' || (curAsk.decisionType==='play' && curAsk.skill==='制衡') || (curAsk.options||[]).some(o=>o.kind==='skill_zhiheng'));
  const isPlay = isPlayAsk();
  // 出牌阶段带制衡选项时：点选保持多选（可攒多张一起制衡），单选也能直接出牌
  const zhihengMode = isPlay && !!(curAsk.options||[]).find(o=>o.kind==='skill_zhiheng');
  const isRespond = isRespondAsk();
  const comboMove = isPlay ? ((curAsk.options||[]).find(m => m.kind === 'sha_combo') || null) : null;
  const comboPool = (comboMove && comboMove.cardIds) || [];
  const playableIds = new Set();
  if (isPlay) for (const m of (curAsk.options||[])) {
    if (m.kind === 'play' && m.cardId != null) playableIds.add(m.cardId);
  }
  const respondIds = new Set();
  if (isRespond) for (const m of (curAsk.options||[])) {
    if (m.kind === 'respond' && m.cardId != null) respondIds.add(m.cardId);
  }
  $('hand0').innerHTML = hand.map(c => {
    // 可点性完全来自引擎计算结果：单牌动作cardId + 丈八组合池（前端不做规则推断）
    const pickable = isPlay ? (playableIds.has(c.id) || comboPool.includes(c.id) || zhihengMode) : isRespond ? respondIds.has(c.id) : isMulti;
    const sel = (isMulti || isPlay || isRespond) && selected.has(c.id);
    return cardHtml(c, pickable, sel, fresh.includes(c.id), (isPlay || isRespond) && !pickable);
  }).join('');
  document.querySelectorAll('#hand0 .card.selectable').forEach(el => {
    el.onclick = () => {
      const id = +el.dataset.id;
      if (isPlay || isRespond) {
        // 制衡模式下点选为多选（攒牌一起换）；否则点选式单选
        if (zhihengMode) {
          if (selected.has(id)) { selected.delete(id); } else { selected.add(id); }
        } else if (isPlay || isRespond) {
        // 点选式：单选；出牌阶段丈八在场时第二张不同手牌自动组对
        if (selected.has(id)) { selected.delete(id); }
        else if (selected.size === 1 && isPlay && comboMove) { selected.add(id); }
        else if (selected.size === 1) { selected.clear(); selected.add(id); }
        else { selected.clear(); selected.add(id); }
        }
        renderHand(); renderPlayConfirm();
        return;
      }
      if (selected.has(id)) selected.delete(id); else selected.add(id);
      renderHand(); renderPromptMulti();
    };
  });
  if (isPlay || isRespond) renderPlayConfirm();
}
function renderPlayConfirm() {
  const box = $('playconfirm');
  if (!box) return;
  box.innerHTML = '';
  const moves = playMovesFor([...selected]);
  for (const m of moves) {
    const b = document.createElement('button');
    b.textContent = m.uiLabel || '确认出牌';
    b.classList.add('confirm');
    b.onclick = () => submitMove(m);
    box.appendChild(b);
  }
  // 主动技按钮（activate 形式）：仁德/苦肉/青囊/结姻/反间等，平铺为确认按钮
  const usedKinds = new Set();
  for (const o of ((curAsk && curAsk.options) || [])) {
    if (o.kind === 'activate' || o.kind === 'skill_fanjian') {
      const b = document.createElement('button');
      b.textContent = o.uiLabel || `发动【${o.skill}】`;
      b.classList.add('confirm');
      b.onclick = () => submitMove(o);
      box.appendChild(b);
      usedKinds.add(o.kind);
    }
  }
  // 制衡：出牌阶段点选若干手牌后发动（与出牌确认并列，选1张时两种按钮都在）
  const zh = ((curAsk && curAsk.options) || []).find(m => m.kind === 'skill_zhiheng');
  if (zh && selected.size > 0) {
    const b = document.createElement('button');
    b.textContent = `发动【制衡】弃${selected.size}张摸${selected.size}张`;
    b.classList.add('confirm');
    b.onclick = () => submitMove({ kind:'skill_zhiheng', cardIds:[...selected] });
    box.appendChild(b);
  }
  // 装备区来源的转化动作（武圣红装备当杀/响应）：不在手牌面板，平铺常驻按钮
  const handIds = new Set((state.ownHand || []).map(c => c.id));
  for (const m of ((curAsk && curAsk.options) || [])) {
    if ((m.kind === 'play' || m.kind === 'respond') && m.cardId != null && !handIds.has(m.cardId)) {
      const b = document.createElement('button');
      b.textContent = m.uiLabel || '确认出牌';
      b.classList.add('confirm');
      b.onclick = () => submitMove(m);
      box.appendChild(b);
    }
  }
}
function renderPromptMulti() {
  if (!curAsk) return;
  const need = curAsk.count;
  const kind = curAsk.decisionType;
  const multi = kind==='discard' ? 'discard' : ((curAsk.options||[]).some(o=>o.kind==='skill_zhiheng') ? 'zhiheng' : null);
  if (multi) {
    const btn = document.createElement('button');
    if (multi==='discard') {
      btn.textContent = `确认弃置（已选${selected.size}/${need}）`;
      btn.disabled = selected.size !== need;
      btn.onclick = () => submitMove({kind:'discard', cardIds:[...selected]});
    } else {
      btn.textContent = `发动【制衡】弃${selected.size}张摸${selected.size}张`;
      btn.disabled = selected.size === 0;
      btn.onclick = () => submitMove({kind:'skill_zhiheng', cardIds:[...selected]});
    }
    const bar = $('promptbar');
    bar.querySelectorAll('button.multic').forEach(b=>b.remove());
    bar.querySelector('.opts').appendChild(btn);
    btn.classList.add('multic');
  }
}
function renderAsk(a) {
  curAsk = a; selected = new Set();
  const bar = $('promptbar');
  bar.innerHTML = `<div class="q">${esc(a.question)}</div><div class="opts"></div>`;
  const opts = bar.querySelector('.opts');
  const multi = a.decisionType==='discard' || (a.options||[]).some(o=>o.kind==='skill_zhiheng');
  if (isPlayAsk()) {
    // 点选式出牌：备选列表隐藏，仅作为可出性判定
    const tip = document.createElement('span');
    const canZhiheng = (a.options||[]).some(o=>o.kind==='skill_zhiheng');
    tip.textContent = '点选下方要出的牌，然后确认打出；灰色牌当前不可出'
      + (canZhiheng ? '；发动【制衡】时可点选自己的装备区（金框）' : '');
    tip.style.cssText = 'color:#999;font-size:12px;align-self:center';
    opts.appendChild(tip);
    const cbox = document.createElement('span');
    cbox.id = 'playconfirm';
    cbox.style.cssText = 'display:flex;gap:6px;align-self:center';
    opts.appendChild(cbox);
    const endBtn = document.createElement('button');
    endBtn.textContent = '结束出牌阶段';
    endBtn.onclick = () => submitMove({ kind: 'end' });
    opts.appendChild(endBtn);
    const fanjian = (a.options||[]).find(o => o.kind === 'skill_fanjian');
    if (fanjian) {
      const fb = document.createElement('button');
      fb.textContent = '发动【反间】';
      fb.onclick = () => submitMove(fanjian);
      opts.appendChild(fb);
    }
  } else if (isRespondAsk()) {
    // 点选式响应：从手牌点选要打出的牌，确认打出
    const tip = document.createElement('span');
    tip.textContent = '点选手牌中要打出的牌，然后点打出';
    tip.style.cssText = 'color:#999;font-size:12px;align-self:center';
    opts.appendChild(tip);
    const cbox = document.createElement('span');
    cbox.id = 'playconfirm';
    cbox.style.cssText = 'display:flex;gap:6px;align-self:center';
    opts.appendChild(cbox);
    const refuse = (a.options||[]).find(o => o.kind === 'refuse');
    if (refuse) {
      const rb = document.createElement('button');
      rb.textContent = refuse.uiLabel || '不响应';
      rb.classList.add('danger2');
      rb.onclick = () => submitMove(refuse);
      opts.appendChild(rb);
    }
  } else if (a.decisionType==='guanxing') {
    // 观星：一次性亮出全部牌，拖拽分配到 牌堆顶/牌堆底 两栏（栏内可换位调序），然后确认
    guanxingTop = (a.optionCards||[]).map(c => c.id);
    guanxingBottom = [];
    const row = document.createElement('div');
    row.id = 'gxrow';
    row.style.cssText = 'display:flex;gap:12px;align-self:center;align-items:stretch';
    opts.appendChild(row);
    const btn = document.createElement('button');
    btn.textContent = '确认观星';
    btn.onclick = () => submitMove({ kind: 'guanxing', tops: guanxingTop.slice(), bottoms: guanxingBottom.slice() });
    opts.appendChild(btn);
    renderGuanxingRow();
  } else if (a.decisionType==='xuanjiang') {
    // 开局选将：每名候选渲染为 头像+武将信息 选项卡，点整卡即出战
    const row = document.createElement('div');
    row.className = 'xjrow';
    for (const c of (a.candidates || [])) {
      const card = document.createElement('div');
      card.className = 'xjcard';
      card.title = '点击选择【' + c.name + '】出战';
      card.innerHTML = `<img class="xjavatar" src="${avatarUrl(c.name)}" onerror="this.style.visibility='hidden'">`
        + `<div class="xjinfo">`
        + `<div class="xjname">${esc(c.name)}`
        + `<span class="xjtag" style="${a.isFirst ? 'background:#5a4a1a;color:#ffd700' : ''}">${a.isFirst ? '本局先手' : '本局后手'}</span>`
        + `<span class="xjtag">${esc(c.kingdom || '')}</span><span class="xjtag">${esc(c.gender || '')}</span>`
        + `<span class="xjhp">${'❤'.repeat(Math.min(c.hp || 0, 9))}</span></div>`
        + `<div class="xjskills">${(c.skills || []).map(s => `<div><b>${esc(s.name)}</b>：${esc(s.text)}</div>`).join('')}</div>`
        + `</div>`;
      card.onclick = () => {
        const opt = (a.options || []).find(o => o.kind === 'choice' && o.value === c.name);
        if (opt) submitMove(opt);
      };
      row.appendChild(card);
    }
    opts.appendChild(row);
  } else if (!multi) {
    for (const o of a.options) {
      const b = document.createElement('button');
      b.textContent = o.uiLabel;
      b.onclick = () => submitMove(o);
      opts.appendChild(b);
    }
  } else {
    const anyArea = (a.options||[]).some(o=>o.area==='any');
    const tip = document.createElement('span');
    tip.textContent = anyArea ? '请点选下方手牌和上方装备区（金框）共需弃置的牌，然后确认' : '请在下方手牌中点选，然后确认';
    tip.style.cssText = 'color:#999;font-size:12px;align-self:center';
    opts.appendChild(tip);
  }
  render(); renderPromptMulti();
}
function gxCardHtml(c, inBottom) {
  if (!c) return '';
  return `<div class="gxcard" draggable="true" data-cid="${c.id}" style="cursor:grab;text-align:center">`
    + cardHtml(c, true, inBottom ? c.id : null)
    + '</div>';
}
function renderGuanxingRow() {
  const row = $('gxrow'); if (!row || !curAsk) return;
  const byId = new Map((curAsk.optionCards||[]).map(c => [c.id, c]));
  const zone = (z, title, ids, color, hint) => `
    <div class="gxzone" data-zone="${z}" style="display:flex;flex-direction:column;gap:4px;padding:6px 8px;border:1.5px dashed ${color};border-radius:6px;min-height:168px">
      <div style="font-size:12px;color:${color};text-align:center">${title}　<span style="color:#789">${hint}</span></div>
      <div class="gxcards" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${ids.map(id => gxCardHtml(byId.get(id), z==='bottom')).join('')}</div>
    </div>`;
  row.innerHTML = zone('top', '牌堆顶', guanxingTop, '#67c23a', '左→右＝先摸→后摸')
    + zone('bottom', '牌堆底', guanxingBottom, '#e6a23c', '左→右＝靠上→贴底');
  bindGuanxingDnD(row);
}
// 观星拖拽：拖到栏空白处＝移入该栏末尾；拖到某张牌上＝与目标交换位置（可跨栏）；点击＝切换栏
function bindGuanxingDnD(row) {
  let dragId = null;
  const clearMarks = () => {
    for (const z of row.querySelectorAll('.gxzone')) z.style.background = '';
    for (const c of row.querySelectorAll('.gxcard')) c.style.outline = '';
  };
  for (const el of row.querySelectorAll('.gxcard')) {
    el.onclick = () => {
      const id = +el.dataset.cid;
      const toBottom = el.closest('.gxzone').dataset.zone === 'top';
      gxMove(id, toBottom ? 'bottom' : 'top');
      renderGuanxingRow();
    };
    el.addEventListener('dragstart', e => {
      dragId = +el.dataset.cid;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(dragId)); } catch(_) {}
    });
    el.addEventListener('dragend', () => { dragId = null; clearMarks(); });
    el.addEventListener('dragover', e => {
      if (dragId === null || dragId === +el.dataset.cid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      el.style.outline = '2px dashed #ffd700';
    });
    el.addEventListener('dragleave', () => { el.style.outline = ''; });
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      const targetId = +el.dataset.cid;
      if (dragId !== null && dragId !== targetId) gxSwap(dragId, targetId);
      dragId = null; clearMarks();
      renderGuanxingRow();
    });
  }
  for (const z of row.querySelectorAll('.gxzone')) {
    z.addEventListener('dragover', e => {
      if (dragId === null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      z.style.background = 'rgba(255,215,0,.08)';
    });
    z.addEventListener('dragleave', () => { z.style.background = ''; });
    z.addEventListener('drop', e => {
      e.preventDefault();
      if (dragId !== null) gxMove(dragId, z.dataset.zone);
      dragId = null; clearMarks();
      renderGuanxingRow();
    });
  }
}
function gxMove(id, zone) { // 移入指定栏末尾
  guanxingTop = guanxingTop.filter(x => x !== id);
  guanxingBottom = guanxingBottom.filter(x => x !== id);
  (zone === 'bottom' ? guanxingBottom : guanxingTop).push(id);
}
function gxSwap(a, b) { // 交换两张牌的位置（可跨栏，各自留在原栏序位）
  const ta = guanxingTop.includes(a) ? guanxingTop : guanxingBottom;
  const tb = guanxingTop.includes(b) ? guanxingTop : guanxingBottom;
  if (ta === tb) {
    const i = ta.indexOf(a), j = ta.indexOf(b);
    [ta[i], ta[j]] = [ta[j], ta[i]];
  } else {
    const i = ta.indexOf(a), j = tb.indexOf(b);
    ta[i] = b; tb[j] = a;
  }
}
async function submitMove(move) {
  if (!curAsk) return;
  $('promptbar').innerHTML = '<div class="waiting">已提交，等待结算…</div>';
  curAsk = null; selected = new Set();
  await fetch('/api/action', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({move}) });
}

const es = new EventSource('/api/events');
$('dbg').onchange = () => { renderHand1(); renderOpp2(); }; // 勾选调试立即生效，不等下次state
es.onmessage = (ev) => {
  const e = JSON.parse(ev.data);
  if (e.type==='hello') { $('btnSave').disabled = !e.running; $('envBadge').classList.toggle('hidden', e.env !== 'test'); }
  else if (e.type==='state') {
    state = e.state; render();
    seedLog(state.log, state.logSeq);
  }
  else if (e.type==='ask') { if (e.playerIdx===0) renderAsk(e); }
  else if (e.type==='log') { addLog(e.msg); if (e.seq) lastLogSeq = Math.max(lastLogSeq, e.seq); }
  else if (e.type==='aiThinking') { $('aiThinking').textContent = e.seat >= 2 ? 'AI(农民2)思考中…' : 'AI思考中…'; $('aiThinking').classList.remove('hidden'); }
  else if (e.type==='ailog') { addLog('⟦AI⟧ '+e.msg, true); $('aiThinking').classList.add('hidden'); }
  else if (e.type==='aidetail') {
    if ($('dbg').checked) {
      const t = (e.reply||'').replace(/\s+/g,' ').trim();
      addLog(`⟦AI决策#${e.n} ${e.durSec}s⟧ ${t.length>260 ? t.slice(0,260)+'…' : t}`, true);
    }
  }
  else if (e.type==='askDone') { $('aiThinking').classList.add('hidden'); }
  else if (e.type==='gameStart') {
    $('log').innerHTML = ''; lastLogSeq = 0;
    addLog(e.resumed ? '=== 恢复对局 ===' : '=== 对局开始 ===');
    $('btnStart').disabled = false;
    $('btnSave').disabled = false;
    $('btnStart').textContent = '重新开局';
    $('overOverlay').classList.add('hidden');
    curAsk = null; selected = new Set();
    prevHandIds = null; // 新对局：初始手牌不高亮
    $('promptbar').innerHTML = '<div class="waiting">等待对局开始…</div>';
    $('aiThinking').classList.add('hidden');
  }
  else if (e.type==='gameOver') {
    $('btnStart').disabled = false;
    $('btnSave').disabled = true;
    $('btnStart').textContent = '1v1对局';
    $('overOverlay').classList.remove('hidden');
    $('overText').textContent = e.winnerRole
      ? (e.winnerRole === '农民' ? '🎉 农民阵营获胜！' : '💀 地主获胜')
      : (e.winner===0 ? '🎉 你赢了！' : '💀 AI 获胜');
    if (state) render();
  }
  else if (e.type==='gameSaved') {
    $('btnStart').disabled = false;
    $('btnSave').disabled = true;
    $('btnStart').textContent = '开始对局';
    $('phaseInfo').textContent = '已存档，可下次继续';
    curAsk = null; $('promptbar').innerHTML = '<div class="waiting">对局已保存，下次可继续</div>';
    $('aiThinking').classList.add('hidden');
  }
  else if (e.type==='gameAbandoned') {
    $('btnStart').disabled = false;
    $('btnSave').disabled = true;
  }
  else if (e.type==='error') addLog('!! '+e.msg, true);
};
function addLog(msg, hit) {
  const box = $('log');
  const div = document.createElement('div');
  if (hit) div.className='hit';
  div.innerHTML = esc(msg);
  box.appendChild(div);
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}
// 日志框内容一变就吸底
new MutationObserver(() => {
  const box = $('log');
  box.scrollTop = box.scrollHeight;
}).observe($('log'), { childList: true, subtree: false });
// 日志去重回放：按序号补齐，重连不重复
let lastLogSeq = 0;
function seedLog(logLines, logSeq) {
  if (!Array.isArray(logLines)) return;
  const first = logSeq - logLines.length;
  logLines.forEach((m, i) => { if (first + i >= lastLogSeq) addLog(m); });
  lastLogSeq = Math.max(lastLogSeq, logSeq || 0);
}
$('btnStart').onclick = async () => {
  $('btnStart').disabled = true;
  const r = await fetch('/api/start', {method:'POST'});
  const j = await r.json();
  if (!j.ok) { alert(j.error); $('btnStart').disabled = false; }
};
$('btnStartDD').onclick = async () => {
  $('btnStartDD').disabled = true;
  const r = await fetch('/api/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({mode:'ddd'}) });
  const j = await r.json();
  if (!j.ok) { alert(j.error); $('btnStartDD').disabled = false; }
  else $('btnStartDD').disabled = false;
};
$('btnSave').onclick = async () => {
  if (!confirm('保存当前对局并退出？之后可随时继续。')) return;
  $('btnSave').disabled = true;
  const r = await fetch('/api/save', {method:'POST'});
  const j = await r.json();
  if (!j.ok) { alert(j.error); $('btnSave').disabled = false; }
};
// 页面加载：有存档则弹出继续对局入口
(async () => {
  try {
    const r = await fetch('/api/saves');
    const j = await r.json();
    const saves = (j.saves || []).filter(s => !s.broken);
    if (!saves.length) return;
    const box = $('saveList');
    for (const s of saves) {
      const when = s.savedAt ? new Date(s.savedAt).toLocaleString('zh-CN') : s.name;
      const desc = (s.generals && s.generals.length === 2)
        ? `${s.generals[0]}(${s.hp ? s.hp[0] : '?'}血) vs ${s.generals[1]}(${s.hp ? s.hp[1] : '?'}血) · 第${s.turnNo}回合 · ${when}`
        : when;
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:center;background:#1c2a1c;border:1px solid #3a5a3a;border-radius:6px;padding:8px 12px;';
      const info = document.createElement('span');
      info.textContent = desc;
      info.style.cssText = 'color:#cde;font-size:13px;flex:1;text-align:left;';
      const btn = document.createElement('button');
      btn.textContent = '继续对局';
      btn.onclick = async () => {
        btn.disabled = true;
        const rr = await fetch('/api/resume', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:s.name})});
        const jj = await rr.json();
        if (!jj.ok) { alert(jj.error); btn.disabled = false; return; }
        $('resumeOverlay').classList.add('hidden');
      };
      const del = document.createElement('button');
      del.textContent = '删除';
      del.className = 'danger';
      del.onclick = async () => {
        if (!confirm(`确认删除存档「${desc}」？删除后不可恢复。`)) return;
        const rr = await fetch('/api/delete_save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:s.name})});
        const jj = await rr.json();
        if (!jj.ok) { alert(jj.error); return; }
        row.remove();
        if (!box.children.length) $('resumeOverlay').classList.add('hidden');
      };
      row.appendChild(info);
      row.appendChild(del);
      row.appendChild(btn);
      box.appendChild(row);
    }
    $('resumeOverlay').classList.remove('hidden');
  } catch (e) {}
})();
$('dbg').onchange = () => renderHand1();
$('modelInfo').textContent = '';
</script>
